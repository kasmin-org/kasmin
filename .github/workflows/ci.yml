name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    # Every Monday about 4:00 in Vienna (winter time; 5:00 in summer, GitHub uses UTC): finds new security advisories
    # and rebuilds the image of main with current updates.
    - cron: "2 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code style, static analysis, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.5", extensions: "intl, zip, gd, bcmath, pdo_mysql", coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        db: ["mariadb:11", "mysql:8.4"]
        experimental: [false]
        include:
          - { php: "8.6", db: "mariadb:11", experimental: true }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_DATABASE: kasmin
          MYSQL_USER: kasmin
          MYSQL_PASSWORD: kasmin
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: kasmin
          MARIADB_USER: kasmin
          MARIADB_PASSWORD: kasmin
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="${{ startsWith(matrix.db, 'mariadb') && 'healthcheck.sh --connect --innodb_initialized' || 'mysqladmin ping -h 127.0.0.1 -proot' }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ startsWith(matrix.db, 'mariadb') && 'mariadb' || 'mysql' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kasmin
      DB_USERNAME: kasmin
      DB_PASSWORD: kasmin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: "intl, zip, gd, bcmath, pdo_mysql"
          coverage: ${{ matrix.php == '8.5' && startsWith(matrix.db, 'mariadb') && 'pcov' || 'none' }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - name: Run tests
        if: ${{ !(matrix.php == '8.5' && startsWith(matrix.db, 'mariadb')) }}
        run: php artisan test
      - name: Run tests with coverage
        if: ${{ matrix.php == '8.5' && startsWith(matrix.db, 'mariadb') }}
        run: php artisan test --coverage-clover=coverage/clover.xml
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.php == '8.5' && startsWith(matrix.db, 'mariadb') }}
        with: { name: coverage, path: coverage/clover.xml }

  installer:
    name: Installer (bootstrap script + web installer)
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env: { MARIADB_DATABASE: kasmin, MARIADB_USER: kasmin, MARIADB_PASSWORD: kasmin, MARIADB_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "intl, zip, gd, bcmath, pdo_mysql", coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Build the package like a release
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts
          npm ci --ignore-scripts --no-audit --no-fund && npm run build && rm -rf node_modules
          php artisan filament:assets
          mkdir -p /tmp/pkg && zip -qr /tmp/pkg/kasmin.zip . -x ".git/*" ".github/*" "tests/*" ".env" "bootstrap/cache/*.php"
          cd /tmp/pkg && sha256sum kasmin.zip > kasmin.zip.sha256
      - name: Unpack with the bootstrap script
        run: php installer/kasmin-setup.php --source=/tmp/pkg/kasmin.zip --target=/tmp/kasmin --db-host=127.0.0.1 --db-name=kasmin --db-user=kasmin --db-password=kasmin --app-url=http://127.0.0.1:8090
      - name: Web installer
        working-directory: /tmp/kasmin
        run: |
          php -S 127.0.0.1:8090 -t public >/tmp/server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/ | grep -q 302
          curl -s -c /tmp/c -b /tmp/c http://127.0.0.1:8090/install -o /tmp/form.html
          token=$(grep -o 'name="_token" value="[^"]*"' /tmp/form.html | sed 's/.*value="//;s/"//')
          curl -s -c /tmp/c -b /tmp/c -X POST http://127.0.0.1:8090/install \
            --data-urlencode "_token=$token" --data-urlencode "organisation=Example Camp" \
            -d locale=en -d defaults=en --data-urlencode "admin_name=Alex Example" -d admin_email=admin@example.org \
            | grep -q "Kasmin is installed"
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/ | grep -q 200
          # The package contains the assets of the admin interface.
          for f in js/filament/filament/app.js js/filament/support/support.js; do curl -sf -o /dev/null "http://127.0.0.1:8090/$f" || { echo "::error::$f is missing in the package"; exit 1; }; done
          php artisan kasmin:status
      - name: Show logs on failure
        if: ${{ failure() }}
        run: tail -n 60 /tmp/kasmin/storage/logs/laravel.log /tmp/server.log 2>/dev/null || true
      - name: Tampered package is rejected
        run: |
          echo x >> /tmp/pkg/kasmin.zip
          ! php installer/kasmin-setup.php --source=/tmp/pkg/kasmin.zip --target=/tmp/kasmin2 --db-host=127.0.0.1 --db-name=kasmin --db-user=kasmin --db-password=kasmin

  upgrade:
    name: Upgrade (${{ matrix.from }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: [v0.10.0, latest]
        db: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: kasmin }
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: production
      APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
      CACHE_STORE: file
      SESSION_DRIVER: file
      MAIL_MAILER: log
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: "intl, zip, gd, bcmath, pdo_mysql, pdo_sqlite", coverage: none }
      - name: Choose the database and the old version
        run: |
          if [ "${{ matrix.db }}" = sqlite ]; then touch /tmp/kasmin.sqlite; echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"; echo "DB_DATABASE=/tmp/kasmin.sqlite" >> "$GITHUB_ENV"
          else echo "DB_CONNECTION=mariadb" >> "$GITHUB_ENV"; echo "DB_DATABASE=kasmin" >> "$GITHUB_ENV"; fi
          from="${{ matrix.from }}"; [ "$from" = latest ] && from=$(git tag -l 'v*' --sort=-v:refname | head -1); echo "FROM=$from" >> "$GITHUB_ENV"
      - name: Install the old version with demo data
        run: |
          new=$(git rev-parse HEAD); git checkout -q "$FROM"
          composer install --no-interaction --no-progress --prefer-dist --no-scripts -q && php artisan package:discover -q
          php artisan kasmin:install --organisation="Old Camp" --locale=de --defaults=de --admin-name="Alex Admin" --admin-email=admin@example.org
          php artisan kasmin:demo --locale=de --families=8 --staff=4 --force
          git checkout -q -f "$new"
      - name: Upgrade
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts -q && php artisan package:discover -q
          php artisan kasmin:upgrade
          php tests/upgrade-check.php

  semgrep:
    name: Security scan (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/php --config p/secrets --error --exclude vendor --exclude node_modules

  docker:
    name: Docker image
    needs: [quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: KASMIN_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}
      - name: Save image for GUI tests
        run: |
          docker buildx build --load -t kasmin:ci --cache-from type=gha . >/dev/null
          docker save kasmin:ci -o /tmp/kasmin-image.tar
      - uses: actions/upload-artifact@v4
        with: { name: image, path: /tmp/kasmin-image.tar, retention-days: 1 }

  container:
    name: Container (variables, TLS, Let's Encrypt)
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: /tmp }
      - run: docker load -i /tmp/kasmin-image.tar
      - run: tests/docker/container.sh kasmin:ci
        timeout-minutes: 12

  gui:
    name: GUI tests (phone and desktop)
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: /tmp }
      - name: Start Kasmin
        run: |
          docker load -i /tmp/kasmin-image.tar
          docker run -d --name kasmin -p 8080:80 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_ENV=production \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/kasmin.sqlite \
            -e SESSION_DRIVER=file -e CACHE_STORE=file -e KASMIN_TLS=off kasmin:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/up && break; sleep 1; done
          docker exec -u www-data kasmin sh -c 'touch /tmp/kasmin.sqlite && php artisan kasmin:install --organisation="Demo Camp" --locale=en --defaults=en --admin-name="Alex Admin" --admin-email=admin@example.org && php artisan kasmin:demo --locale=en --families=5 --staff=3 --force'
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Login links for a demo legal guardian with invoices
        run: |
          email=$(docker exec -u www-data -e HOME=/tmp kasmin php artisan tinker --execute='echo App\Models\Invoice::query()->whereNotNull("payer_id")->first()?->payer?->user?->email;' | tail -1)
          echo "KASMIN_LINK_DESKTOP=$(docker exec -u www-data kasmin php artisan kasmin:login-link "$email" | tail -1)" >> "$GITHUB_ENV"
          echo "KASMIN_LINK_PHONE=$(docker exec -u www-data kasmin php artisan kasmin:login-link "$email" | tail -1)" >> "$GITHUB_ENV"
          echo "KASMIN_ADMIN_DESKTOP=$(docker exec -u www-data kasmin php artisan kasmin:login-link admin@example.org | tail -1)" >> "$GITHUB_ENV"
          echo "KASMIN_ADMIN_PHONE=$(docker exec -u www-data kasmin php artisan kasmin:login-link admin@example.org | tail -1)" >> "$GITHUB_ENV"
          docker cp tests/e2e/make-approvals.php kasmin:/tmp/make-approvals.php
          links=$(docker exec -u www-data -e HOME=/tmp kasmin php artisan tinker --execute="require '/tmp/make-approvals.php';" | grep '^/approvals/')
          echo "KASMIN_APPROVAL_DESKTOP=$(echo "$links" | sed -n 1p)" >> "$GITHUB_ENV"
          echo "KASMIN_APPROVAL_PHONE=$(echo "$links" | sed -n 2p)" >> "$GITHUB_ENV"
      - run: npx playwright test --trace off
        env: { KASMIN_URL: "http://127.0.0.1:8080", CI: "true" }
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  security:
    name: Container scan (Trivy)
    needs: [docker]
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.count.outputs.findings }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image, path: /tmp }
      - run: docker load -i /tmp/kasmin-image.tar
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kasmin:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - id: count
        run: echo "findings=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy.json)" >> "$GITHUB_OUTPUT"

  badges:
    name: Update badges
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
    needs: [tests, semgrep, security, gui, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: coverage, path: coverage }
      - name: Write badge files
        run: |
          mkdir -p out
          pct=$(python3 -c "import xml.etree.ElementTree as E;m=E.parse('coverage/clover.xml').getroot().find('project/metrics');s=int(m.get('statements'));c=int(m.get('coveredstatements'));print(round(100*c/s) if s else 0)")
          color=$([ $pct -ge 80 ] && echo brightgreen || ([ $pct -ge 60 ] && echo yellow || echo red))
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${pct}%\",\"color\":\"$color\"}" > out/coverage-${GITHUB_REF_NAME}.json
          n=${{ needs.security.outputs.findings }}
          scolor=$([ "$n" = "0" ] && echo brightgreen || echo red)
          smsg=$([ "$n" = "0" ] && echo "no high/critical findings" || echo "$n high/critical")
          echo "{\"schemaVersion\":1,\"label\":\"security scan\",\"message\":\"$smsg\",\"color\":\"$scolor\"}" > out/security-${GITHUB_REF_NAME}.json
      - name: Push to badges branch
        run: |
          git init -q -b badges repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin badges; then git reset -q --hard FETCH_HEAD; fi
          cp -f ../out/*.json .
          git add -A
          git commit -q -m "Update badges for ${GITHUB_REF_NAME}" || exit 0
          git push -q origin HEAD:badges

  report:
    name: Report a failed weekly run
    needs: [quality, tests, installer, upgrade, semgrep, docker, container, gui, security]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the issue
        run: |
          title="Weekly check failed"
          body="The weekly run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (new security advisories are a frequent reason)."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[]|select(.title==\"$title\")|.number" | head -1)
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
