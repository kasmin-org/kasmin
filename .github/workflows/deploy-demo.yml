name: Deploy demo instances

# Brings the latest release (no pre-releases) to the demo instances demo-de.kasmin.org and demo-en.kasmin.org
# (shared hosting). The demos update THEMSELVES, the way every installation does: this job only asks them to
# (POST /system/hooks/update), calls the address that finishes the update and then checks that the new version
# really runs. That takes a few minutes and tests the real update path with every release.
#
# The upload via FTPS (release ZIP, checksum, .env from the environment secrets) is the fallback: for an instance
# that is empty or older than 0.29 (it has no update hook yet), and on demand with "method: ftp" – also to repair
# an instance or to change its .env.
#
# If this job fails, the demos still follow by themselves: their automatic update is set to one day after a release.
# Runs after every release build and on demand. Requires valid HTTPS on the target – no unencrypted fallback.

on:
  workflow_run:
    workflows: ["Release packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      method:
        description: "self = the demos update themselves (FTP only where that is not possible); ftp = upload the files"
        type: choice
        options: [self, ftp]
        default: self

permissions:
  contents: read

jobs:
  release:
    name: Find the latest release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "Latest release: ${tag:-none}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.release.outputs.tag }} to demo-${{ matrix.lang }}
    needs: release
    # Serialised per instance on the job level: runs whose condition skips them (e.g. after a develop build) no
    # longer take the slot of a pending release deployment.
    concurrency:
      group: deploy-demo-${{ matrix.lang }}
      cancel-in-progress: false
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [de, en]
    environment:
      name: demo-${{ matrix.lang }}
      url: https://demo-${{ matrix.lang }}.kasmin.org
    env:
      TAG: ${{ needs.release.outputs.tag }}
      HOST: demo-${{ matrix.lang }}.kasmin.org
    steps:
      - name: Let the demo update itself
        id: self
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.method != 'ftp' }}
        env:
          HOOK_TOKEN: ${{ secrets.HOOK_TOKEN }}
        run: |
          # The demo downloads the release, verifies the checksum, backs up database and files and swaps the files.
          code=$(curl -s -o /tmp/update.json -w '%{http_code}' --max-time 900 -X POST \
            -H "Authorization: Bearer ${HOOK_TOKEN}" -H 'Accept: application/json' \
            --data-urlencode "version=${TAG#v}" "https://${HOST}/system/hooks/update" || true)
          echo "update hook: HTTP ${code}"
          jq 'del(.finish)' /tmp/update.json 2>/dev/null || true
          if [ "$code" = "404" ]; then
            echo "No update hook on ${HOST} (empty, or older than 0.29): uploading the files instead."
            echo "method=ftp" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" != "200" ] || [ "$(jq -r '.ok' /tmp/update.json)" != "true" ]; then
            echo "::error::${HOST} could not update itself to ${TAG} (HTTP ${code}): $(jq -r '.message // empty' /tmp/update.json 2>/dev/null). Its automatic update tries again within a day; 'method: ftp' uploads the files."
            exit 1
          fi
          echo "method=self" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.updated' /tmp/update.json)" = "true" ]; then
            # Second step with the new program files: the database.
            finish=$(jq -r '.finish' /tmp/update.json)
            echo "::add-mask::${finish}"
            fcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 600 "$finish")
            echo "finish: HTTP ${fcode}"
            [ "$fcode" = "200" ] || { echo "::error::The files of ${TAG} are in place on ${HOST}, but finishing the update answered ${fcode}. An administrator can finish it on the login page (Upgrade)."; exit 1; }
          else
            echo "${HOST} already runs $(jq -r '.installed' /tmp/update.json)."
          fi
      - name: Download and verify the release package
        if: ${{ steps.self.outputs.method != 'self' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "kasmin-${TAG}.zip*" --dir /tmp/pkg
          cd /tmp/pkg && sha256sum -c "kasmin-${TAG}.zip.sha256"
          mkdir -p /tmp/app && unzip -q "kasmin-${TAG}.zip" -d /tmp/app
      - name: Write configuration
        if: ${{ steps.self.outputs.method != 'self' }}
        run: |
          cat > /tmp/app/.env <<ENV
          APP_NAME="Kasmin Demo"
          APP_ENV=demo
          APP_DEBUG=false
          APP_URL=https://${HOST}
          APP_LOCALE=${{ matrix.lang }}
          APP_FALLBACK_LOCALE=en
          APP_KEY=${{ secrets.APP_KEY }}
          LOG_CHANNEL=daily
          LOG_LEVEL=warning
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          SESSION_DRIVER=database
          SESSION_SECURE_COOKIE=true
          CACHE_STORE=database
          QUEUE_CONNECTION=database
          MAIL_MAILER=smtp
          MAIL_SCHEME=smtps
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=465
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
          MAIL_FROM_ADDRESS=demo@demo.kasmin.org
          MAIL_FROM_NAME="Kasmin Demo"
          KASMIN_HOOK_TOKEN=${{ secrets.HOOK_TOKEN }}
          KASMIN_DEMO_LOCALE=${{ matrix.lang }}
          KASMIN_DEMO_ADMIN_EMAIL=admin@demo.kasmin.org
          KASMIN_DEMO_EMAIL_DOMAIN=demo.kasmin.org
          ENV
          sed -i 's/^ *//' /tmp/app/.env
      - name: Upload via FTPS (lftp mirror, TLS enforced, certificate checked)
        if: ${{ steps.self.outputs.method != 'self' }}
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          # While the files are uploaded (many minutes) visitors see "Kasmin is being updated" instead of errors from
          # half-replaced files: the page is put in place first and taken away last.
          cp /tmp/app/resources/maintenance/updating.php /tmp/maintenance.php
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
            set net:max-retries 5; set net:reconnect-interval-base 5; set net:timeout 30;
            mkdir -p -f storage/framework; put /tmp/maintenance.php -o storage/framework/maintenance.php;
            mirror -R --parallel=4 --only-newer --no-perms \
              --exclude-glob .git* --exclude storage/logs/ --exclude storage/framework/sessions/ \
              --exclude storage/framework/cache/data/ --exclude storage/app/backups/ /tmp/app/ ./;
            rm -f storage/framework/maintenance.php;
            quit"
      - name: Wait for valid HTTPS
        run: |
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null "https://${HOST}/up"; then echo "HTTPS ok"; exit 0; fi
            sleep 15
          done
          echo "::error::https://${HOST} is not reachable with a valid certificate. Activate Let's Encrypt for ${HOST} in the hosting panel."
          exit 1
      - name: Demo set-up (only if empty), upgrade and check that the release runs
        run: |
          echo "Updated by: ${{ steps.self.outputs.method == 'self' && 'the demo itself' || 'upload via FTPS' }}" >> "$GITHUB_STEP_SUMMARY"
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.HOOK_TOKEN }}" "https://${HOST}/system/hooks/demo"; echo
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.HOOK_TOKEN }}" "https://${HOST}/system/hooks/upgrade"; echo
          curl -sf -o /dev/null -w "start page: %{http_code}\n" "https://${HOST}/"
          # /up alone is not enough: the API document must come from the new release (packages loaded, version right).
          doc=$(curl -sf "https://${HOST}/docs/api.json" | jq -r '.info.version')
          echo "API document: ${doc}"
          case "$doc" in *"Kasmin ${TAG#v})"*) ;; *) echo "::error::${HOST} does not run ${TAG}"; exit 1;; esac
          curl -sf -o /dev/null "https://${HOST}/js/filament/filament/app.js" || { echo "::error::assets of the admin interface are missing"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "https://${HOST}/mcp")
          [ "$code" = 401 ] || { echo "::error::MCP endpoint answered ${code} instead of 401"; exit 1; }
